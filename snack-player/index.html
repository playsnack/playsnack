    <script>
      // Preload only the fonts this screen draws first, in parallel with the app
      // code. Play links (#/p/… or /p/…) draw the app canvas: body 500 + 700 and
      // the pixel face (every official app uses these three; see
      // packages/bite-pixi/src/fonts.js; the pixel subset is Latin/digits only,
      // a few KB). Home draws Korean headings in Snack Body 700 and the SNACK
      // mark in Press Start 2P. Subsets: scripts/subset_fonts.py.
      (function () {
        var play = /^#\/p\//.test(location.hash) || /\/p\//.test(location.pathname);
        var base = location.pathname.replace(/\/p\/.*$/, "/").replace(/[^/]*$/, "") + "fonts/";
        var files = play
          ? ["snackbody-500.woff2", "snackbody-700.woff2", "galmuri11.woff2", "snackbody-600.woff2?ui"]
          : ["snackbody-600.woff2?ui", "pressstart2p.woff2"];
        var preload = function (href, as, type) {
          var l = document.createElement("link");
          l.rel = "preload";
          l.as = as;
          if (type) l.type = type;
          l.crossOrigin = "anonymous";
          l.href = href;
          document.head.appendChild(l);
        };
        files.forEach(function (f) {
          preload(base + f, "font", "font/woff2");
        });
        // Static build: an official app's document, fetched alongside the code
        // (path link, or an old hash link the app rewrites to it).
        var tpl = location.pathname.match(/\/p\/tpl-([a-z0-9-]+)/) || location.hash.match(/^#\/p\/tpl-([a-z0-9-]+)/);
        if (tpl) {
          var data = base.replace(/fonts\/$/, "") + "data/bite/";
          // An app that plays another app's file (index.json `template`; kept equal by test/catalog.test.ts).
          var file = { "speed-quiz": "speed-trivia-score" }[tpl[1]] || tpl[1];
          preload(data + file + ".bite.json", "fetch");
          preload(data + "index.json", "fetch"); // tells whether the link was merged into another app
        }
      })();
    </script>

    <style>
      /* Mini-Block Arcade faces — self-hosted (no CDN), subsets built by
         scripts/subset_fonts.py. Korean headings use "Snack Body" 600 (#102; a
         shell-only Pretendard subset — the canvas keeps 500/700 so drawn text
         matches the engine's embedded metrics); the pixel faces are only for
         Latin/digit-only text (logo, scores — #84), so their subsets carry no
         Hangul. The weight split matches the canvas
         (packages/bite-pixi/src/fonts.js). "?ui" keeps these faces from
         claiming the canvas's preload of the same file (Chrome then fetches it
         twice). */
      @font-face {
        font-family: "Snack Body";
        src: url("/fonts/snackbody-600.woff2?ui") format("woff2");
        font-weight: 550 649; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Snack Body";
        src: url("/fonts/snackbody-700.woff2?ui") format("woff2");
        font-weight: 650 1000; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Galmuri11";
        src: url("/fonts/galmuri11.woff2?ui") format("woff2");
        font-weight: 1 549; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Galmuri11";
        src: url("/fonts/galmuri11-bold.woff2?ui") format("woff2");
        font-weight: 550 1000; font-style: normal; font-display: swap;
      }
      @font-face {
        font-family: "Press Start 2P";
        src: url("/fonts/pressstart2p.woff2") format("woff2");
        font-weight: normal; font-style: normal; font-display: swap;
      }
      /* The notch / home-indicator insets, one definition for the shell and the
         canvas (viewport-fit=cover above). */
      :root { --snack-safe-top: env(safe-area-inset-top, 0px); --snack-safe-bottom: env(safe-area-inset-bottom, 0px); }
      html, body, #root { margin: 0; height: 100%; background: #000; }
      body { overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    </style>
